spec_version: "0.1"
name: opendata_census
title: 自治体オープンデータの公開状況
description: |-
  全国の自治体が、デジタル庁の自治体標準オープンデータセット 31 項目を公開しているかどうかを、各オープンデータカタログの API から観測した記録です。判定に使った検索語とヒット数も持つので、判定の根拠を確認できます。

  出典：各カタログの CKAN API を Queria が観測して作成。
keywords:
  - オープンデータ
  - 自治体標準オープンデータセット
  - 公開状況
  - デジタル庁
  - 自治体
  - CKAN
  - オープンデータカタログ
homepage: https://github.com/queria-io/dataset-opendata-census
language: ja
