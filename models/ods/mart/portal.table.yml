schema: ods
name: portal
title: 観測対象のオープンデータカタログ
description: |-
  観測したオープンデータカタログの一覧です。measurement の観測範囲を表します。

  - 観測に失敗したカタログも、status に理由を入れて残しています
keywords:
  - オープンデータ
  - カタログ
  - CKAN
published: true
fields:
  - name: portal_id
    title: カタログID
  - name: title
    title: カタログ名
  - name: operator
    title: 運営者
  - name: site_url
    title: サイトURL
  - name: api_base
    title: API のベースURL
  - name: catalog_type
    title: カタログの種別
    description: ckan など
  - name: organization_count
    title: 登録組織数
  - name: lg_organization_count
    title: うち団体コードを持つ組織数
    description: measurement の対象になった組織の数
  - name: non_lg_organizations
    title: 団体コードを持たない組織
    description: セミコロン区切り
  - name: status
    title: 観測の結果
    description: measured または failed:<理由>
  - name: measured_on
    title: 観測日
