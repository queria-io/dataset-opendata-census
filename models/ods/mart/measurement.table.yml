schema: ods
name: measurement
title: 自治体標準ODS 項目別の公開状況
description: |-
  団体 × 項目ごとに、自治体標準オープンデータセットを公開しているかどうかを観測した結果です。公開していない組み合わせも is_published = false の行で持ちます。

  - 判定はデータセット名の部分一致による近似で、公式の値ではありません。実際より少なく出る傾向があります
  - 観測していないカタログの団体は行がありません。全国の団体を分母にするときは lg_code と結合してください
keywords:
  - オープンデータ
  - 自治体標準オープンデータセット
  - 公開状況
  - デジタル庁
  - 自治体
published: true
sources:
  - title: 自治体標準オープンデータセット（デジタル庁）
    path: https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（検査数字付き）。カタログの organization 名から取得
    semantic: { role: entity, name: city }
  - name: lg_code_5
    title: 全国地方公共団体コード（5桁）
    description: 検査数字を除いた先頭5桁
    semantic: { role: entity, name: city }
  - name: prefecture_code
    title: 都道府県コード
    description: 団体コードの先頭2桁
    semantic: { role: entity, name: prefecture }
  - name: item_no
    title: 項目番号
    description: 自治体標準オープンデータセット一覧の1〜31
  - name: item_key
    title: 項目キー
  - name: item_label
    title: 項目名
  - name: definition_book
    title: データ項目定義書
    description: A〜H。策定省庁がデジタル庁以外の項目は E〜H
  - name: is_published
    title: 公開しているか
    description: 観測時点でタイトル一致のデータセットが1件以上あれば true
  - name: dataset_count
    title: 一致したデータセット数
    description: 検索語をまたぐ重複計上を避けるため、語ごとの件数の最大値
  - name: portal_id
    title: 観測したカタログ
  - name: measured_on
    title: 観測日
