  - name: item_key
    title: 項目キー
  - name: item_label
    title: 項目名
  - name: search_word
    title: 検索語
  - name: dataset_count
    title: タイトル一致したデータセット数
    description: カタログ全体での件数。団体数ではない
  - name: status
    title: 観測の結果
    description: ok または failed
  - name: measured_on
    title: 観測日
