version: 2

models:
  - name: measurement
    columns:
      - name: lg_code
        data_tests: [not_null]
      - name: item_no
        data_tests: [not_null]
      - name: is_published
        data_tests: [not_null]
  - name: item
    columns:
      - name: item_no
        data_tests: [unique, not_null]
      - name: item_key
        data_tests: [unique, not_null]
  - name: portal
    columns:
      - name: portal_id
        data_tests: [unique, not_null]
  - name: search_word_hit
    columns:
      - name: search_word
        data_tests: [not_null]
