$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 検索語ごとのヒット数
description: |-
  カタログ × 項目 × 検索語ごとのヒット数で、measurement の判定の根拠です。

  - dataset_count はカタログ全体のデータセット数で、団体の数ではありません
topics:
  - オープンデータ
  - 判定根拠
columns:
  - name: portal_id
    title: カタログID
  - name: item_no
    title: 項目番号
  - name: item_key
    title: 項目キー
  - name: item_label
    title: 項目名
  - name: search_word
    title: 検索語
    description: 検索語
  - name: dataset_count
    title: タイトル一致したデータセット数
    description: カタログ全体での件数。団体数ではない
  - name: status
    title: 観測の結果
    description: ok または failed
  - name: measured_on
    title: 観測日
